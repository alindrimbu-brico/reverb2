<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oglinda – se reface</title>
    <meta name="description" content="Oglinda, un refugiu de reflecție, se reface cu texte noi.">
    <meta name="robots" content="noindex, follow">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
    <style>
        /* 26 nov 2026: reflecțiile vechi erau textul unei cărți publicate; pagina rămâne în așteptare până la textele proprii. */
        :root { --bg: #0b0b12; --text: #e7e5ef; --muted: #a9a6b8; --line: rgba(231, 229, 239, 0.14); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); font-family: 'Spectral', Georgia, serif;
            display: grid; place-items: center; padding: 2rem; line-height: 1.6;
        }
        main { max-width: 34rem; text-align: center; }
        .brand { font-family: 'Cinzel', serif; font-size: 0.95rem; letter-spacing: 0.4em; color: var(--muted); margin-bottom: 3rem; }
        h1 { font-family: 'Cinzel', serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.3; margin-bottom: 1.5rem; text-wrap: balance; }
        p { font-size: 1.15rem; color: var(--muted); text-wrap: pretty; }
        hr { border: 0; border-top: 1px solid var(--line); width: 4rem; margin: 2.5rem auto; }
    </style>
</head>
<body>
    <main>
        <div class="brand" aria-hidden="true">O G L I N D A</div>
        <h1>Precum sus, așa și jos.</h1>
        <p>Oglinda se reface, cu reflecții scrise de la zero.</p>
        <hr>
        <p>Revino în curând.</p>
    </main>
</body>
</html>
